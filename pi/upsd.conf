# Ziel: /etc/nut/upsd.conf auf dem Raspberry Pi
#
# PI_IP durch die tatsaechliche, feste IP des Pi im entsprechenden
# Netzwerksegment ersetzen (kein 0.0.0.0 - bewusst auf ein Interface
# beschraenkt). Vor finalem Rollout eine feste Reservierung (Router oder
# statisch auf dem Pi) sicherstellen.

LISTEN PI_IP 3493
LISTEN 127.0.0.1 3493
