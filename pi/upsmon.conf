# Ziel: /etc/nut/upsmon.conf auf dem Raspberry Pi
#
# WICHTIG: Diese Instanz dient AUSSCHLIESSLICH der lokalen Kuma-
# Benachrichtigung (siehe monitoring/SETUP.md) - sie trifft KEINE
# Shutdown-Entscheidung. Das ist eine bewusste, mehrfach abgesicherte
# Architektur-Entscheidung:
#
#   1. SHUTDOWNCMD ist auf "/bin/true" neutralisiert (kein echter
#      Shutdown-Befehl) - upsmon kann intern seinen vollen Zustands-
#      automat durchlaufen, ohne dass am Ende real etwas passiert.
#   2. Rolle ist "secondary", NICHT "primary" - POWERDOWNFLAG (der
#      einzige Mechanismus, der die USV abschalten koennte) wird laut
#      upsmon.conf(5) ausschliesslich von einem upsmon im primary-Modus
#      gesetzt. Mit "secondary" ist dieser Pfad strukturell unerreichbar.
#
# NIEMALS SHUTDOWNCMD hier auf einen echten Shutdown-Befehl aendern oder
# die Rolle auf "primary" umstellen - das wuerde der Kernarchitektur
# dieses Projekts widersprechen (Pi faehrt niemals selbst herunter, siehe
# proxmox/SETUP.md fuer die tatsaechliche Shutdown-Logik auf Proxmox-Seite).
#
# CHANGE_ME durch dasselbe Passwort wie in upsd.users ersetzen.

MONITOR apc2200@localhost 1 monuser CHANGE_ME secondary

SHUTDOWNCMD "/bin/true"

NOTIFYCMD /usr/local/bin/nut-kuma-notify.sh
NOTIFYFLAG ONBATT SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT SYSLOG+WALL+EXEC
NOTIFYFLAG ONLINE SYSLOG+WALL+EXEC
