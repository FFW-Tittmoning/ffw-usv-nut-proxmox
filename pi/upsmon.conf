# Ziel: /etc/nut/upsmon.conf auf dem Raspberry Pi (lokale/primary-Ueberwachung)
#
# CHANGE_ME durch dasselbe Passwort wie in upsd.users ersetzen.

MONITOR apc2200@localhost 1 monuser CHANGE_ME primary

# Der Pi selbst haengt an derselben USV und sollte sich ebenfalls sauber
# herunterfahren, bevor der Akku leer ist:
SHUTDOWNCMD "/sbin/shutdown -h now"
