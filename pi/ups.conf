# Ziel: /etc/nut/ups.conf auf dem Raspberry Pi
#
# Entscheidung 2026-08-14: USB-Weg statt Serial. Die USV (APC Smart-UPS
# SUA2200I) wird per USB-A-zu-RJ50-Kabel (Delock 67016) am "USB"-Port
# angeschlossen; Treiber ist usbhid-ups (nutzt intern den APC-spezifischen
# apc-hid-Subtreiber von NUT). Details/Begruendung siehe CLAUDE.md.
#
# Vor dem Einkommentieren:
#   1. Kabel angeschlossen und per `lsusb` bestaetigt, dass die USV
#      als USB-Geraet erkannt wird
#   2. Verbindung isoliert getestet, z.B.
#        usbhid-ups -DDDD -a apc2200
#      oder
#        upsdrvctl start
#        upsc apc2200@localhost
#
# override.battery.charge.low: rein softwareseitiger Treiber-Override,
# KEIN Schreibzugriff auf die USV-Hardware. Ersetzt den von der USV
# gemeldeten Werks-Wert (haeufig 10%, fuer Server-/VM-Workloads meist zu
# knapp) fuer die Berechnung des "LB"(Low Battery)-Status. Wert pro
# Standort anpassen - siehe proxmox/SETUP.md, Abschnitt "Wahl der
# Schwelle", fuer die Kriterien.

[apc2200]
    driver = usbhid-ups
    port = auto
    desc = "APC Smart-UPS SUA2200I - Standort XY"
    override.battery.charge.low = 30
