# Ziel: /etc/nut/upsmon.conf auf dem Proxmox-Host
#
# IP des Pi (USVPI) ist aktuell PI_IP (per DHCP, noch nicht fixiert -
# vor Rollout pruefen, siehe CLAUDE.md). CHANGE_ME durch das echte,
# generierte Passwort ersetzen (auf dem Pi: sudo cat /etc/nut/upsd.users).

MONITOR apc2200@PI_IP 1 monuser CHANGE_ME secondary

SHUTDOWNCMD "/sbin/shutdown -h now"
