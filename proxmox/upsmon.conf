# Ziel: /etc/nut/upsmon.conf auf dem Proxmox-Host
#
# PI_IP und CHANGE_ME entsprechend den Werten aus pi/upsd.conf und
# pi/upsd.users ersetzen (echtes generiertes Passwort: auf dem Pi
# `sudo cat /etc/nut/upsd.users`). Vor Rollout feste IP sicherstellen.
# Details zur Shutdown-Logik: siehe proxmox/SETUP.md.

MONITOR apc2200@PI_IP 1 monuser CHANGE_ME secondary

SHUTDOWNCMD "/sbin/shutdown -h now"
